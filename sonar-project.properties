# SonarCloud / SonarQube configuration — SQA section 3.9
sonar.organization=didulakaru
sonar.projectKey=DidulaKaru_Amboss_web
sonar.projectName=Amboss Web

sonar.host.url=https://sonarcloud.io
sonar.sourceEncoding=UTF-8

# SonarCloud analyses the whole repo; sonar.sources / sonar.tests / sonar.test.inclusions have no effect
# there, and test files (*.test.ts, *.spec.ts) are detected automatically.
sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,client/public/**,server/drizzle/**,docs/sqa/evidence/**

# Test-support code is exercised by Cucumber/Playwright/Selenium, not measured by Vitest coverage
sonar.coverage.exclusions=server/features/**,client/e2e/**,client/selenium/**,**/*.config.*

# Coverage produced by `npm run test:coverage` (lcov reporter in both Vitest configs).
# The CI sonar job rewrites the SF: paths to be repo-root relative before the scan.
sonar.javascript.lcov.reportPaths=client/coverage/lcov.info,server/coverage/lcov.info
