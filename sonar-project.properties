# SonarCloud / SonarQube configuration — SQA section 3.9
# TODO(team): replace both values with the ones shown on SonarCloud after importing the repo
sonar.organization=REPLACE_WITH_SONARCLOUD_ORG
sonar.projectKey=REPLACE_WITH_PROJECT_KEY
sonar.projectName=Amboss Web

sonar.host.url=https://sonarcloud.io
sonar.sourceEncoding=UTF-8

sonar.sources=client/src,server/src
sonar.tests=client/tests,client/e2e,client/selenium,server/tests,server/features
sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,client/public/**,server/drizzle/**
sonar.test.inclusions=**/*.test.ts,**/*.spec.ts,**/*.test.mjs,server/features/**/*.ts

# Coverage produced by `npm run test:coverage` (lcov reporter in both Vitest configs)
sonar.javascript.lcov.reportPaths=client/coverage/lcov.info,server/coverage/lcov.info
