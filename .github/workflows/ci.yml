name: CI

on:
  push:
    paths:
      - 'client/**'
      - 'server/**'
      - 'package.json'
      - '.github/workflows/**'
  pull_request:
    paths:
      - 'client/**'
      - 'server/**'
      - 'package.json'
      - '.github/workflows/**'

jobs:
  client:
    name: Client checks & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint --if-present

      - name: Build
        run: npm run build
